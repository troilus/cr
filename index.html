<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>列车经由查询</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e6e8ec; --text:#111827;
    --muted:#6b7280; --accent:#2563eb; --accent-soft:#eff4ff; --warn:#b45309;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
         "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 16px}
  a{color:var(--accent)}

  /* ---------- 头部 ---------- */
  .hd{background:var(--card);border-bottom:1px solid var(--line);padding:26px 0 22px}
  .hd h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.3px}
  .hd .hits{display:inline-block;line-height:0;margin-bottom:8px}
  .hd .hits img{display:block;height:20px;width:auto}
  .hd .sub{margin:4px 0 16px;color:var(--muted);font-size:13px}
  .hdrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .hdmain{min-width:0}
  .hdbar{
    margin:0 0 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);overflow:hidden;
  }
  .hdstats{
    display:flex;flex-wrap:wrap;align-items:center;
    font-size:12px;line-height:2;color:var(--muted);
    padding:3px 0;
  }
  .hdi{display:inline-block;flex:0 0 auto;white-space:nowrap;padding:0 7px}
  .hdi::before{
    content:"";display:inline-block;width:5px;height:5px;margin-right:6px;
    border-radius:50%;background:#16a34a;vertical-align:1px;
  }
  .hdi b{color:var(--text);font-weight:600}
  .hdi a{color:var(--accent);text-decoration:none}
  .hdi a:hover{text-decoration:underline}
  .box{position:relative;display:flex;gap:8px}
  .box input{
    flex:1;min-width:0;height:44px;padding:0 14px;font-size:16px;
    border:1px solid var(--line);border-radius:10px;background:#fbfbfc;
    outline:none;transition:border-color .15s,box-shadow .15s;
    text-transform:uppercase;
  }
  .box input::placeholder{text-transform:none;color:#9aa1ab}
  .box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
  .box button{
    height:44px;padding:0 22px;font-size:15px;font-weight:600;color:#fff;
    background:var(--accent);border:0;border-radius:10px;cursor:pointer;
  }
  .box button:active{transform:translateY(1px)}

  .ac{
    position:absolute;top:50px;left:0;right:168px;z-index:20;margin:0;padding:4px;
    list-style:none;background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px rgba(17,24,39,.10);max-height:300px;overflow:auto;
  }
  .ac li{padding:9px 12px;border-radius:7px;cursor:pointer;font-variant-numeric:tabular-nums}
  .ac li.on,.ac li:hover{background:var(--accent-soft);color:var(--accent)}
  .ac .ty{
    display:inline-block;font-size:11px;line-height:1.5;padding:0 4px;margin-right:7px;
    border:1px solid var(--line);border-radius:4px;color:#9aa1ab;background:#fafbfc;
  }
  .hint{margin-top:10px;font-size:13px;color:var(--muted)}
  .hint b{color:var(--text);cursor:pointer;border-bottom:1px dashed var(--line)}
  .hint b:hover{color:var(--accent);border-color:var(--accent)}
  .qhist{
    display:flex;gap:6px;overflow-x:auto;margin-top:10px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .qhist[hidden]{display:none}
  .qhist::-webkit-scrollbar{display:none}
  .qchip{
    flex:0 0 auto;padding:3px 10px;border:1px solid var(--line);border-radius:999px;
    background:var(--card);color:#4b5563;font-size:12px;text-decoration:none;white-space:nowrap;
  }
  .qchip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  /* ---------- 结果卡 ---------- */
  main{padding:22px 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:visible}
  .head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px 18px 14px}
  .no{font-size:22px;font-weight:700;letter-spacing:.5px}
  .route{font-size:15px}
  .route i{font-style:normal;color:var(--muted);margin:0 4px}
  .meta{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  .tabs{display:flex;gap:6px;padding:0 18px 12px;flex-wrap:wrap}
  .tabs button{
    font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--muted);
  }
  .tabs button.on{background:var(--accent-soft);border-color:#c7d7fe;color:var(--accent);font-weight:600}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  /* 窄屏下 6 列表格会超出卡片宽度，单独给个横向滚动容器（宽屏不加，保住粘性表头） */
  .tw{overflow:visible}
  thead th{
    position:sticky;top:0;background:#fafbfc;border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);padding:9px 12px;font-size:12px;
    font-weight:600;color:var(--muted);text-align:left;letter-spacing:.4px;z-index:3;
  }
  thead th.r,td.r{text-align:right}
  thead th.n,td.n{width:52px;text-align:right;color:var(--muted);font-size:12px}
  thead th.tm,td.tm{
    width:60px;text-align:right;white-space:nowrap;color:#374151;
    font-variant-numeric:tabular-nums;
  }
  td.tm .dash{color:#cbd0d6}
  i.d{
    font-style:normal;font-size:10px;font-weight:600;color:var(--warn);
    margin-left:1px;vertical-align:super;
  }
  .note{padding:0 18px 10px;font-size:12px;color:#9aa1ab}
  .note b{color:var(--warn)}
  .tstatus{
    margin:0 18px 10px;padding:7px 10px;border-radius:8px;background:#f8fafc;
    font-size:12px;color:#6b7280;line-height:1.7;
  }
  .tstatus .ts-time b{color:#374151;font-weight:600;font-variant-numeric:tabular-nums}
  .tstatus .ts-spd{font-weight:600;color:#6b7280;font-variant-numeric:tabular-nums}
  .tstatus .ts-spd.dwell{color:#dc2626}
  .tstatus .ts-route{color:#374151}
  .tstatus .ts-route i{font-style:normal;color:#9aa1ab;margin:0 2px}
  .tstatus .ts-route .mid{color:#15803d;font-weight:600}
  .tstatus .ts-run{margin-top:2px;color:#374151;font-variant-numeric:tabular-nums}
  tbody td{padding:8px 12px;border-bottom:1px solid #f1f2f4;font-size:14px}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.chg{background:#fffdf5}
  tbody tr.term td{font-weight:650}
  .st{display:flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:#d1d5db;flex:none}
  tr.chg .dot{background:var(--warn)}
  .tag{
    font-size:11px;padding:1px 6px;border-radius:5px;background:#fef3c7;
    color:var(--warn);border:1px solid #fde68a;font-weight:500;white-space:nowrap;
  }
  .ln{color:var(--muted);font-size:13px}
  .ln.split{color:var(--warn);font-weight:600}
  thead th.sp,td.sp{width:76px;white-space:nowrap;color:var(--muted);font-size:13px;vertical-align:middle}

  /* ---------- 结果列表 ---------- */
  .no.sm{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:1px}
  .grp{
    display:flex;align-items:baseline;gap:8px;padding:12px 18px 6px;
    font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.6px;
    border-top:1px solid var(--line);
  }
  .grp .cnt{font-weight:400;color:#9aa1ab;letter-spacing:0}
  /* 线路页的「线路经由」表 */
  .via thead th.n,.via td.n{width:44px}
  .via tbody td{padding:7px 12px}
  .note a{color:var(--accent);text-decoration:none}
  .note a:hover{text-decoration:underline}
  .listbar{
    position:sticky;top:0;z-index:6;background:var(--card);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:0 0 8px;
  }
  .listbar .grp{border-top:0;padding:10px 18px 6px}
  .fbar{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 2px}
  .fopt{
    display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.6;
    color:var(--muted);border:1px solid var(--line);border-radius:999px;
    padding:1px 8px;background:#fff;cursor:pointer;user-select:none;
  }
  .fopt input{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
  .fopt.on{background:var(--accent-soft);border-color:#c7d7fe;color:var(--accent);font-weight:600}
  .fopt:hover{border-color:#c7d7fe;color:var(--accent)}

  /* ---------- 站名链接 / 车次 chips / 浮窗 ---------- */
  a.sl{color:inherit;text-decoration:none;border-bottom:1px dotted transparent}
  a.sl:hover{border-bottom-color:#c3c9d4}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 18px 10px}
  .chip{
    font:inherit;font-size:12px;line-height:1.6;padding:2px 9px;border-radius:999px;
    background:#eef2f8;color:#4b5563;border:1px solid #e3e9f2;cursor:pointer;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .chip:hover{background:#e5ebf5;color:#1f2937}
  .chip.k{background:#e8f0fe;border-color:#d6e2fb;color:#1a56b0;font-weight:600}
  .chips .clab{font-size:12px;color:var(--muted);align-self:center;margin:0 2px 0 4px}
  a.chip{display:inline-block;color:#4b5563;text-decoration:none}
  a.chip:hover{color:#1f2937}
  .pop{
    position:fixed;z-index:90;width:320px;max-width:calc(100vw - 16px);
    background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 14px 40px rgba(17,24,39,.16);font-size:13px;
  }
  .pop-hd{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;
  }
  .pop-x{border:0;background:none;padding:0 2px;font-size:18px;line-height:1;color:#9aa1ab;cursor:pointer}
  .pop-x:hover{color:#4b5563}
  .pop-bd{padding:10px 12px;max-height:60vh;overflow:auto}
  .pp dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0 0 4px}
  .pp dt{color:var(--muted);white-space:nowrap}
  .pp dd{margin:0;word-break:break-all}
  .pp .ps{margin:8px 0 4px;font-size:12px;color:var(--muted)}
  .pp .pl{line-height:1.9}
  .pp .pl a{color:var(--accent);text-decoration:none;margin-right:8px}
  .pp .pl a:hover{text-decoration:underline}
  .pp .pl b{color:#111827}
  .tp .tp-rt{font-size:15px;font-weight:600;color:var(--text);line-height:1.6}
  .tp .tp-rt i{font-style:normal;color:#9aa1ab;margin:0 4px}
  .tp .tp-tm{margin-top:2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tp .tp-tm b{color:#374151;font-weight:600}
  .tp .tp-st{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .tp .tp-spd{color:#374151;font-weight:600;font-variant-numeric:tabular-nums}
  .tp .tp-spd.dwell{color:#dc2626}
  .tp .tp-route{color:#374151}
  .tp .tp-route i{font-style:normal;color:#9aa1ab;margin:0 2px}
  .tp .tp-route .mid{color:#15803d;font-weight:600}
  .tp .pl{margin-top:6px}
  .tagx{
    display:inline-block;margin:0 6px 4px 0;padding:1px 7px;border-radius:5px;
    background:#f3f4f6;color:#4b5563;font-size:12px;
  }
  .pop.sheet{
    left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;
    border-radius:14px 14px 0 0;border-bottom:0;
  }
  .pop.sheet .pop-bd{max-height:64vh;padding-bottom:16px}
  .res{list-style:none;margin:0;padding:0 8px 8px}
  .res a{
    display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;
    text-decoration:none;color:inherit;
  }
  .res a:hover{background:var(--accent-soft)}
  .res b{font-size:15px;font-weight:650;letter-spacing:.3px;min-width:62px;flex:none}
  .res .rt{
    flex:0 1 auto;max-width:52%;color:var(--muted);font-size:13px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .res .rt i{font-style:normal;color:#9aa1ab;margin:0 2px}
  .res .rt .ln{color:#15803d;font-weight:600}
  .res .rt .rtst{font-size:15px;font-weight:650;color:var(--text)}
  .res .rt .rtt{
    margin-left:7px;color:#9aa1ab;font-size:11px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .res .lv{
    flex:1;min-width:0;display:block;color:#1f2937;font-size:11px;
    text-align:center;overflow:hidden;
  }
  .res .lv .lvtop{
    display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;
  }
  .res .lv .lvhd{color:#9aa1ab;font-size:10px;margin-right:3px}
  .res .lv .lvin{
    display:block;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
    line-height:1.2;
  }
  .res .lv i{font-style:normal;color:#9aa1ab;margin:0 2px}
  .res .lv .lvspd{
    color:#6b7280;font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .res .lv .lvspd.dwell{color:#dc2626;font-weight:600}
  .res .lv .mid{font-size:inherit;font-weight:inherit;letter-spacing:0;min-width:0;color:#15803d}  .res .rm{
    flex:none;color:#9aa1ab;font-size:12px;
    font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto;
  }
  .res .tm{
    flex:none;color:#374151;font-size:12px;
    font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto;margin-right:10px;
  }
  .more{padding:0 18px 14px;font-size:12px;color:#9aa1ab}
  .morebtn{
    font:inherit;font-size:12px;line-height:1.7;margin:0 8px 6px 0;padding:3px 12px;
    border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--accent);cursor:pointer;
  }
  .morebtn:hover{border-color:#c7d7fe;background:var(--accent-soft)}
  .more2{padding-top:8px;font-size:13px;color:#9aa1ab}

  /* ---------- 区段高亮 ---------- */
  .hl{
    margin:0 18px 12px;padding:8px 11px;border-radius:8px;
    background:#f6fbf7;border:1px solid #e3f1e7;color:#166534;font-size:13px;
  }
  tbody tr.seg td{background:#f6fbf7}
  tbody tr.pick td{background:#ecfdf3}
  .tag.ok{
    background:#dcfce7;color:#15803d;border-color:#bbf7d0;
  }

  /* 估算位置的当前区间：上一站 / 下一站 */
  tbody tr.live-a td, tbody tr.live-b td, tbody tr.live td{background:#f0fdf4}
  tbody tr.live-a td:first-child, tbody tr.live-b td:first-child, tbody tr.live td:first-child{
    box-shadow:inset 3px 0 0 #16a34a;
  }
  tbody tr.live-a .dot, tbody tr.live-b .dot, tbody tr.live .dot{background:#16a34a}
  tbody tr.live-a .st::after, tbody tr.live-b .st::after, tbody tr.live .st::after{
    font-size:11px;padding:1px 6px;border-radius:5px;background:#dcfce7;color:#15803d;
    border:1px solid #bbf7d0;font-weight:500;white-space:nowrap;
  }
  tbody tr.live-a .st::after{content:"上一站"}
  tbody tr.live-b .st::after{content:"下一站"}
  tbody tr.live .st::after{content:"当前"}

  /* 运行中车次前的绿三角 */
  .run-dot{
    display:inline-block;width:0;height:0;
    border-left:6px solid #16a34a;
    border-top:4px solid transparent;
    border-bottom:4px solid transparent;
    margin-right:5px;vertical-align:1px;
    animation:runblink 1.2s ease-out infinite;
  }
  @keyframes runblink{
    0%,100%{opacity:1}
    50%{opacity:.35}
  }
  @media (prefers-reduced-motion:reduce){.run-dot{animation:none}}

  .err{padding:26px 18px;color:var(--muted)}
  .err b{color:var(--text)}
  .empty{padding:40px 18px;text-align:center;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:10px}

  .ft{padding:18px 0 40px;color:#9aa1ab;font-size:12px;line-height:1.8}
  .ft a{color:#9aa1ab}

  /* ---------- 加载遮罩（首屏解析 8 MB 数据时挡住白屏） ---------- */
  .loading{
    position:fixed;left:0;top:0;right:0;bottom:0;z-index:99;
    display:flex;align-items:center;justify-content:center;
    background:rgba(245,246,248,.7);
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    opacity:1;transition:opacity .4s ease;
  }
  .loading.off{opacity:0;pointer-events:none}
  .ld{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:26px 30px 24px;border-radius:16px;border:1px solid var(--line);
    background:rgba(255,255,255,.92);box-shadow:0 12px 34px rgba(17,24,39,.10);
    text-align:center;
  }
  .ring{
    width:26px;height:26px;border-radius:50%;
    border:3px solid #dde4ef;border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .lt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .ls{margin-top:4px;font-size:12px;color:var(--muted)}
  .lbar{margin-top:4px;width:210px;height:4px;border-radius:2px;background:#e9edf4;overflow:hidden}
  .lbar i{display:block;height:100%;width:4%;background:var(--accent);transition:width .2s ease}
  .loading.unknown .lbar i{width:38%;animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}
  @media (prefers-reduced-motion:reduce){
    .ring{animation-duration:2.4s}
    .loading.unknown .lbar i{animation:none;width:60%}
  }

  /* ---------- 清空按钮 ---------- */
  .box button.sec{
    background:#fff;color:var(--muted);border:1px solid var(--line);
    font-weight:500;padding:0 16px;
  }
  .box button.sec:hover{background:#fafbfc;color:var(--text)}
  .box button.sec:active{transform:translateY(1px)}

  /* ---------- 两栏：表格 + 线路图 ---------- */
  main.wide{max-width:1280px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;align-items:start}
  .colmain{min-width:0}
  .mapcol{
    min-width:0;padding:0 14px 14px;border-left:1px solid var(--line);
    position:sticky;top:10px;
  }
  .card.mapoff .cols{grid-template-columns:1fr}
  .card.mapoff .mapcol{display:none}
  .mapbtn{
    font:inherit;font-size:12px;line-height:1.7;padding:2px 10px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;
  }
  .mapbtn:hover{border-color:#c7d7fe;background:var(--accent-soft);color:var(--accent)}
  .map-hd{display:flex;align-items:center;gap:8px;padding:12px 0 6px;font-size:12px;color:var(--muted)}
  .map-hd b{font-size:13px;color:var(--text);font-weight:600}
  .map-hd .sp{margin-left:auto}
  .map-reset{
    font:inherit;font-size:11px;padding:1px 8px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--muted);
  }
  .map-reset:hover{color:var(--accent);border-color:#c7d7fe}
  .map-big{
    font:inherit;font-size:11px;padding:1px 8px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--muted);
  }
  .map-big:hover{color:var(--accent);border-color:#c7d7fe}
  body.bigmap{overflow:hidden}
  body.bigmap .mapcol{
    position:fixed;inset:0;z-index:80;background:#fff;border-left:0;
    padding:12px 18px 18px;display:flex;flex-direction:column;overflow:hidden;
  }
  body.bigmap .mapcol .map-hd,body.bigmap .mapcol .map-lg{flex:none}
  body.bigmap .mapcol .mapwrap{flex:1;min-height:0;max-height:none;display:flex}
  body.bigmap .mapcol .rmap{height:100%;width:100%}
  body.bigmap .map-hd,body.bigmap .map-lg,body.bigmap .map-lg a{font-size:14px}
  body.bigmap .map-hd b{font-size:16px}
  body.bigmap .map-zoom-level{font-size:13px}
  .map-trains-lg .mp-center-toggle+i{
    width:0;height:0;border-radius:0;border:1.5px solid #16a34a;transform:scale(.85);
  }
  .map-zoom{
    font:inherit;font-size:13px;line-height:1;width:22px;height:20px;padding:0;
    border-radius:6px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);
  }
  .map-zoom:hover{color:var(--accent);border-color:#c7d7fe}
  .map-zoom-level{
    font:inherit;font-size:11px;color:var(--muted);min-width:34px;text-align:center;
    font-variant-numeric:tabular-nums;user-select:none;
  }
  .rmap{
    display:block;width:100%;height:auto;background:#fbfcfe;
    border:1px solid #eef0f4;border-radius:10px;touch-action:none;cursor:grab;
    font-family:inherit;
  }
  .rmap:active{cursor:grabbing}
  .rmap text{font-family:inherit;user-select:none}
  /* Safari 部分版本不支持 SVG text 的 paint-order，白描边会盖住字，直接去掉描边 */
  @supports not (paint-order: stroke){
    .rmap text{stroke:none !important}
  }
  .rmap .mp-st{cursor:pointer}
  .rmap .mp-st:hover circle{fill:var(--accent)}
  .rmap .mp-stl{cursor:pointer}
  .rmap .mp-focus{cursor:pointer}
  .map-lg{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:9px;font-size:12px}
  .map-lg a{display:inline-flex;align-items:center;gap:5px;color:#4b5563;text-decoration:none}
  .map-lg a:hover{color:var(--accent)}
  .map-lg i{width:11px;height:3px;border-radius:2px;display:inline-block;flex:none}
  .map-lg .map-now{display:inline-flex;align-items:center;gap:5px;color:#15803d;font-weight:600}
  .map-lg .map-now .mp-now-t{font-variant-numeric:tabular-nums;font-weight:500}
  .map-lg .map-now .mp-now-s{font-weight:400;color:#4b5563}
  .map-lg .map-trains-lg{display:inline-flex;align-items:center;gap:5px;color:#15803d;font-weight:600;cursor:pointer;user-select:none}
  .map-lg .map-trains-lg input{width:13px;height:13px;margin:0;flex:none;accent-color:#16a34a;cursor:pointer}
  .map-lg .map-locate{
    font:inherit;font-size:14px;line-height:1;width:22px;height:20px;padding:0;
    border:1px solid var(--line);border-radius:6px;background:#fff;color:#2563eb;cursor:pointer;
  }
  .map-lg .map-locate:hover{border-color:#93c5fd;background:#eff6ff}
  .map-lg .map-trains-lg i{
    width:0;height:0;display:inline-block;
    border-left:5px solid #16a34a;border-top:3px solid transparent;border-bottom:3px solid transparent;
  }
  .rmap .mp-train{cursor:pointer;transition:transform 1s linear;transform-box:view-box;transform-origin:0 0}
  .rmap .mp-train:hover path{fill:#0f766e}
  .rmap .mp-train.mv path{animation:trainFlash .6s ease-out}
  .rmap a.hot .mp-train path,
  .rmap .mp-now.hot .mp-now-tri path{
    transform:scale(2);transform-box:fill-box;transform-origin:center;
    transition:transform .15s ease-out;
  }
  .rmap a.hot text,.rmap .mp-now.hot .mp-now-label{transition:font-size .15s ease-out}
  .rmap .mp-train text .spd{opacity:.75;font-size:.78em;font-weight:500}
  .rmap .mp-train text .spd.dwell,
  .rmap .mp-now-label .spd.dwell{color:#dc2626;opacity:1;font-weight:600}
  @keyframes trainFlash{
    0%{opacity:.25;stroke-width:4}
    60%{opacity:1;stroke-width:2.4}
    100%{opacity:1;stroke-width:1.2}
  }
  .map-lg .map-now i{
    width:0;height:0;border-radius:0;background:none;
    border-left:8px solid #16a34a;border-top:5px solid transparent;border-bottom:5px solid transparent;
    animation:nowblink 1.25s ease-out infinite;
  }
  @keyframes nowblink{
    0%,100%{opacity:1}
    50%{opacity:.45}
  }
  .rmap path.mp-ln{transition:opacity .12s,stroke-width .12s}
  .rmap path.mp-ln.dim{opacity:.14}
  .rmap path.mp-ln.hot{opacity:1;stroke-width:6}
  body.bigmap .rmap path.mp-ln.hot{stroke-width:10}
  .rmap .mp-now-tri{transition:transform 1s linear;will-change:transform}
  .rmap .mp-now-label .spd{opacity:.75;font-size:.78em;font-weight:500}
  .map-note{margin-top:6px;font-size:11px;line-height:1.6;color:#9aa1ab}
  .map-note b{color:var(--warn);font-weight:500}
  .map-skel{padding:44px 0;text-align:center;font-size:12px;color:var(--muted)}
  .facts{display:flex;flex-wrap:wrap;gap:5px 16px;padding:0 18px 12px;font-size:12px;color:#4b5563}
  .facts .k{color:var(--muted);margin-right:4px}
  .facts b{color:var(--text);font-weight:600}

  @media (max-width:1000px){
    .hdrow{display:block}
    .hdbar{margin:0 0 10px}
    .cols{grid-template-columns:1fr}
    .mapcol{
      order:-1;border-left:0;border-bottom:1px solid var(--line);
      position:static;padding:0 14px 12px;
    }
    .mapwrap{max-height:60vh;overflow:hidden}
    .rmap{max-height:60vh}
    .rmap text{letter-spacing:.2px}
    .res a{flex-wrap:wrap}
    .res .lv{order:5;flex:1 1 100%;max-width:none;padding-left:0;margin-top:1px;justify-content:center}
  }

  @media (max-width:560px){
    .hd{padding:20px 0 18px}
    .hdstats{font-size:11px}
    .hdi{flex:0 1 auto;white-space:normal;min-width:0;padding:0 6px}
    .head{padding:14px 14px 12px;gap:8px}
    .no{font-size:19px}
    .meta{margin-left:0;width:100%}
    thead th,tbody td{padding:8px 10px}
    table{min-width:500px}
    thead th.sp,td.sp{width:62px;font-size:12px}
    .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
    thead th.n,td.n{width:38px}
    thead th.tm,td.tm{width:46px;font-size:12px}
    .res .tm{font-size:11px}
    .ac{right:0}
    .grp{padding:10px 14px 6px}
    .chips{padding:2px 14px 10px}
    .res{padding:0 4px 6px}
    .res b{min-width:54px;font-size:14px}
    .res .rm{font-size:11px}
    .hl{margin:0 14px 10px}
  }
</style>
</head>
<body>

<noscript><style>.loading{display:none}</style></noscript>

<!-- 首屏遮罩：routes.js 有 8 MB，先画遮罩再拉数据，避免白屏 -->
<div class="loading" id="loading" role="status" aria-live="polite">
  <div class="ld">
    <div class="ring"></div>
    <div>
      <div class="lt" id="ld-msg">正在加载数据…</div>
      <div class="ls">车次 · 车站 · 线路 · 时刻（约 8 MB）</div>
    </div>
    <div class="lbar"><i id="ld-bar"></i></div>
  </div>
</div>

<header class="hd">
  <div class="wrap">
    <div class="hdrow">
      <div class="hdmain">
        <a class="hits" href="https://hits.sh/cr.xanyi.eu.org/" target="_blank" rel="noopener"
           title="今日访问 / 总访问">
          <img alt="CR 访问量"
               src="https://hits.sh/cr.xanyi.eu.org.svg?view=today-total&amp;label=CR&amp;color=007ec6"
               onerror="this.parentNode.style.display='none'">
        </a>
        <h1>列车经由查询</h1>
        <p class="sub">输入车次、车站或线路，查看经由、线路与累计里程；也可以查「A 到 B」区间</p>
      </div>
    </div>
    <div class="hdbar"><div class="hdstats" id="hdstats"></div></div>
    <div class="box">
      <input id="q" type="search" placeholder="车次 / 站名 / 线路，如 D366、武汉、京广线"
             autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
      <button id="go" type="button">查询</button>
      <button id="clr" type="button" class="sec">清空</button>
      <ul id="ac" class="ac" hidden></ul>
    </div>
    <div class="qhist" id="qhist" hidden></div>
    <div class="hint" id="hint"></div>
  </div>
</header>

<main class="wrap" id="out"></main>

<footer class="wrap ft" id="ft"></footer>

<script>
/* 数据加载：能 fetch 就按字节报进度，file:// 下退回 <script> 标签。
   加载完再注入 app.js，遮罩由 app.js 在首屏渲染后收掉。 */
(function () {
  var ov = document.getElementById('loading');
  var msg = document.getElementById('ld-msg');
  var bar = document.getElementById('ld-bar');
  var pct = 4, timer = null;

  function setMsg(t) { if (msg) msg.textContent = t; }
  function setPct(p) {
    pct = Math.max(pct, Math.min(100, p));
    if (bar) bar.style.width = Math.max(4, pct) + '%';
  }
  function startFake() {
    if (ov) ov.className = 'loading unknown';
    if (typeof setInterval !== 'function') return;
    var t0 = Date.now();
    if (timer && typeof clearInterval === 'function') clearInterval(timer);
    timer = setInterval(function () {
      if (pct >= 90) return;
      setPct(4 + (Date.now() - t0) / 9000 * 86);
    }, 120);
  }
  function stopFake() {
    if (timer && typeof clearInterval === 'function') clearInterval(timer);
    timer = null;
  }

  function loadApp() {
    stopFake();
    var a = document.createElement('script');
    var v = (window.ROUTE_DATA && window.ROUTE_DATA.ver) || '';
    var lm = 0;
    try { lm = Date.parse(document.lastModified) || 0; } catch (e) { /* noop */ }
    a.src = 'app.js' + (location.protocol === 'file:' || !v ? '' : '?v=' + encodeURIComponent(v + '-' + lm));
    document.body.appendChild(a);
  }

  function plain() {
    startFake();
    setMsg('正在加载数据…');
    var s = document.createElement('script');
    s.src = 'routes.js';
    s.onload = function () { stopFake(); setPct(100); setMsg('正在渲染…'); loadApp(); };
    s.onerror = function () { stopFake(); setMsg('数据加载失败，请刷新重试'); };
    document.body.appendChild(s);
  }

  function evalText(text) {
    stopFake();
    setPct(100);
    setMsg('正在解析数据…');
    (0, eval)(text);
    setMsg('正在渲染…');
    loadApp();
  }

  function fetchPlain() {
    return fetch('routes.js').then(function (r) {
      if (!r.ok || !r.body || !r.body.getReader) throw new Error('no stream');
      var total = +r.headers.get('content-length') || 0;
      if (total && ov) ov.className = 'loading';
      var got = 0, chunks = [], rd = r.body.getReader();
      function pump() {
        return rd.read().then(function (x) {
          if (x.done) return;
          chunks.push(x.value);
          got += x.value.length;
          /* 服务器可能 gzip/br 压缩，实际字节会超过 content-length，压到 96% 以内，100% 留给解析完成 */
          if (total) setPct(Math.min(96, got * 100 / total));
          return pump();
        });
      }
      return pump().then(function () {
        var buf = new Uint8Array(got), off = 0;
        for (var i = 0; i < chunks.length; i++) { buf.set(chunks[i], off); off += chunks[i].length; }
        evalText(new TextDecoder('utf-8').decode(buf));
      });
    });
  }

  function fetchGz() {
    return fetch('routes.js.gz').then(function (r) {
      if (!r.ok || !r.body) throw new Error('no gz');
      var enc = (r.headers.get('content-encoding') || '').toLowerCase();
      if (enc === 'gzip' || enc === 'br') {
        /* 服务器已经把这个 .gz 解开了，直接当文本读 */
        return r.text().then(evalText);
      }
      if (!window.DecompressionStream || !window.TransformStream) throw new Error('no decompression');
      var total = +r.headers.get('content-length') || 0;
      if (total && ov) ov.className = 'loading';
      var got = 0;
      var counter = new TransformStream({
        transform: function (chunk, ctrl) {
          got += chunk.byteLength;
          if (total) setPct(Math.min(96, got * 100 / total));
          ctrl.enqueue(chunk);
        }
      });
      var stream = r.body.pipeThrough(counter).pipeThrough(new DecompressionStream('gzip'));
      var rd = stream.getReader(), chunks = [];
      function pump() {
        return rd.read().then(function (x) {
          if (x.done) return;
          chunks.push(x.value);
          return pump();
        });
      }
      return pump().then(function () {
        var len = 0, i;
        for (i = 0; i < chunks.length; i++) len += chunks[i].byteLength;
        var buf = new Uint8Array(len), off = 0;
        for (i = 0; i < chunks.length; i++) { buf.set(chunks[i], off); off += chunks[i].byteLength; }
        evalText(new TextDecoder('utf-8').decode(buf));
      });
    });
  }

  startFake();
  if (location.protocol !== 'file:' && window.fetch && window.TextDecoder) {
    var p = (window.DecompressionStream && window.TransformStream)
      ? fetchGz().catch(fetchPlain)
      : fetchPlain();
    p.catch(plain);
  } else {
    plain();
  }
})();
</script>
</body>
